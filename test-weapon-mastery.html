<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weapon Mastery Screen Test</title>
  <style>
    body { margin: 0; background: #111; font-family: sans-serif; }
  </style>
  <script type="module">
    import { WeaponMasteryScreen } from '/src/ui/WeaponMasteryScreen.ts';
    import { MasteryPointStore } from '/src/systems/MasteryPointStore.ts';

    // Give the player some points so the Standard tree shows affordable/unlocked states
    const ps = new MasteryPointStore();
    ps.reset();
    for (let i = 0; i < 8; i++) ps.earnPoint();
    // Unlock a_1, a_2, a_3, a_4 (trunk of Standard)
    ps.spendPoint('standard_a_1');
    ps.spendPoint('standard_a_2');
    ps.spendPoint('standard_a_3');
    ps.spendPoint('standard_a_4');
    // Unlock al_5 (Scatter start)
    ps.spendPoint('standard_al_5');

    const screen = new WeaponMasteryScreen();
    screen.setPointStore(ps);
    screen.show();
    window.__wms = screen;
    window.__ps = ps;
    console.log('WeaponMasteryScreen ready. Points available:', ps.availablePoints);
  </script>
</head>
<body></body>
</html>
