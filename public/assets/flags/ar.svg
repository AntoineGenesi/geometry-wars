<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40">
  <!-- Saudi Arabia Flag (simplified) -->
  <rect width="60" height="40" fill="#006C35"/>
  <!-- Sword blade (horizontal, pointing right) -->
  <polygon points="8,22 50,22 50,20 54,23 50,26 50,24 8,24" fill="white"/>
  <!-- Sword grip / hilt -->
  <rect x="6" y="19" width="4" height="8" rx="1" fill="white"/>
  <!-- Stylised Shahada bar (decorative white bar) -->
  <rect x="10" y="13" width="38" height="2.5" rx="1" fill="white"/>
  <!-- Shahada dots / diacritics (simplified) -->
  <circle cx="16" cy="11.5" r="1.2" fill="white"/>
  <circle cx="24" cy="11.5" r="1.2" fill="white"/>
  <circle cx="32" cy="11.5" r="1.2" fill="white"/>
  <circle cx="40" cy="11.5" r="1.2" fill="white"/>
  <circle cx="47" cy="11.5" r="1.2" fill="white"/>
</svg>
