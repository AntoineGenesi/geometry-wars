<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="bg-teslacoil" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#000008"/>
    </radialGradient>
    <filter id="glow-teslacoil">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-teslacoil)"/>
  <!-- Grid lines for depth -->
  <g opacity="0.08" stroke="#88aaff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="128" y1="0" x2="128" y2="360"/>
    <line x1="256" y1="0" x2="256" y2="360"/>
    <line x1="384" y1="0" x2="384" y2="360"/>
    <line x1="512" y1="0" x2="512" y2="360"/>
  </g>
  <!-- Central weapon effect rings -->
  <circle cx="320" cy="150" r="70" fill="none" stroke="#88aaff" stroke-width="1.5" opacity="0.2" filter="url(#glow-teslacoil)"/>
  <circle cx="320" cy="150" r="45" fill="none" stroke="#88aaff" stroke-width="1" opacity="0.3" filter="url(#glow-teslacoil)"/>
  <circle cx="320" cy="150" r="20" fill="#88aaff" opacity="0.1" filter="url(#glow-teslacoil)"/>
  <circle cx="320" cy="150" r="5" fill="#88aaff" opacity="0.9" filter="url(#glow-teslacoil)"/>
  <!-- Projectile traces -->
  <line x1="325" y1="150" x2="440" y2="110" stroke="#88aaff" stroke-width="2" opacity="0.6" filter="url(#glow-teslacoil)"/>
  <line x1="325" y1="150" x2="430" y2="155" stroke="#88aaff" stroke-width="1.5" opacity="0.4" filter="url(#glow-teslacoil)"/>
  <line x1="325" y1="150" x2="420" y2="195" stroke="#88aaff" stroke-width="2" opacity="0.5" filter="url(#glow-teslacoil)"/>
  <!-- Enemy dots -->
  <circle cx="450" cy="105" r="8" fill="none" stroke="#aa44ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="445" cy="155" r="6" fill="none" stroke="#4444ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="430" cy="200" r="7" fill="none" stroke="#ff44aa" stroke-width="1.5" opacity="0.5"/>
  <!-- Player chevron -->
  <polygon points="310,140 325,150 310,160" fill="#88aaff" opacity="0.8" filter="url(#glow-teslacoil)"/>
  <!-- Title -->
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#88aaff" letter-spacing="4"
        filter="url(#glow-teslacoil)">TESLA COIL</text>
  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="11" fill="#444466" letter-spacing="3">IN-GAME PREVIEW</text>
  <!-- Border -->
  <rect x="1" y="1" width="638" height="358" fill="none" stroke="#88aaff" stroke-width="1" opacity="0.15"/>
</svg>