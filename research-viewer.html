    content: `## 2026-02-08 - Colyseus Schema v2 + ES2022 useDefineForClassFields Bug

**Context:** LAN multiplayer joiner could connect but saw no game state - all values were \`undefined\`. Server confirmed state was populated.

**Root Cause:**
\`@colyseus/schema\` v2.0.37 + TypeScript ES2022 target breaks state encoding.

The \`Schema\` constructor installs getter/setter descriptors on \`this\` via \`Object.defineProperties()\`. These setters call \`this.$changes.change(field)\` for change tracking. But with ES2022 target, TypeScript compiles class field initializers (e.g., \`surfaceType: string = 'sphere'\`) to \`Object.defineProperty(this, 'surfaceType', { value: 'sphere', writable: true, ... })\` which **overwrites** the getter/setter with a plain value property. This destroys change tracking.

Even \`id!: string\` (definite assignment with no initializer) emits \`Object.defineProperty\` in esbuild/tsx because ES2022 spec mandates \`[[Define]]\` semantics for class fields.

Result: \`$changes.allChanges\` is always empty, \`encodeAll()\` returns empty array, \`ROOM_STATE\` message contains zero bytes of data.

**Fix:** Use \`declare\` keyword for all schema properties (emits NO JavaScript), set defaults in constructor body (goes through tracked setters).

**Affected file:** \`server/schema/GameState.ts\` - all 6 schema classes

**Key Lesson:** When using \`@colyseus/schema\` (or any library that relies on prototype getter/setters) with TypeScript ES2022 target and esbuild/tsx, ALWAYS use \`declare\` for property declarations.`

// ===== SIMPLE MARKDOWN PARSER =====
function parseMarkdown(md) {
  // Escape HTML first
  let html = md
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
    let highlighted = code;
    // Simple syntax highlighting
    highlighted = highlighted.replace(/(\/\/.*$)/gm, '<span class="cmt">$1</span>');
    highlighted = highlighted.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>');
    highlighted = highlighted.replace(/\b(const|let|var|function|class|import|export|from|return|if|else|for|while|new|this|typeof|interface|type|extends|implements|async|await|void|null|undefined|true|false|declare|super)\b/g, '<span class="kw">$1</span>');
    highlighted = highlighted.replace(/(&quot;[^&]*?&quot;|'[^']*?'|`[^`]*?`)/g, '<span class="str">$1</span>');
    highlighted = highlighted.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
    return '<pre><code>' + highlighted + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Tables
  html = html.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)*)/gm, function(match, header, separator, body) {
    let table = '<table><thead><tr>';
    header.split('|').filter(c => c.trim()).forEach(cell => {
      table += '<th>' + cell.trim() + '</th>';
    });
    table += '</tr></thead><tbody>';
    body.trim().split('\n').forEach(row => {
      table += '<tr>';
      row.split('|').filter(c => c.trim()).forEach(cell => {
        table += '<td>' + cell.trim() + '</td>';
      });
      table += '</tr>';
    });
    table += '</tbody></table>';
    return table;
  });

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rules
  html = html.replace(/^---+$/gm, '<hr>');
  html = html.replace(/^\*\*\*+$/gm, '<hr>');

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Unordered lists
  html = html.replace(/^(\s*)[-*] (.+)$/gm, function(match, indent, content) {
    return indent + '<li>' + content + '</li>';
  });

  // Ordered lists
  html = html.replace(/^(\s*)\d+\. (.+)$/gm, function(match, indent, content) {
    return indent + '<li>' + content + '</li>';
  });

  // Wrap consecutive <li> in <ul>
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // Paragraphs - wrap loose text blocks
  html = html.replace(/^(?!<[hupoltbd]|<\/|<blockquote|<hr|<pre|<code)(.+)$/gm, '<p>$1</p>');

  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');

  return html;
}

// ===== RENDERING =====
const container = document.getElementById('reportContainer');
const searchBox = document.getElementById('searchBox');
const statsEl = document.getElementById('stats');

let activeFilters = new Set(['research', 'decision', 'architecture', 'debug']);

function getCategoryLabel(cat) {
  switch(cat) {
    case 'research': return 'Research';
    case 'decision': return 'Decision';
    case 'architecture': return 'Architecture';
    case 'debug': return 'Debug';
    default: return cat;
  }
}

function renderReports() {
  const query = searchBox.value.toLowerCase().trim();
  let visibleCount = 0;
  let html = '';

  for (const r of reports) {
    // Filter by category
    if (!activeFilters.has(r.category)) continue;

    // Filter by search
    if (query) {
      const searchable = (r.title + ' ' + r.content + ' ' + r.path).toLowerCase();
      if (!searchable.includes(query)) continue;
    }

    visibleCount++;
    const renderedContent = parseMarkdown(r.content);

    html += '<div class="report cat-' + r.category + '" id="report-' + visibleCount + '">'
      + '<div class="report-header" onclick="toggleReport(this.parentElement)">'
      + '<span class="report-toggle">&#9654;</span>'
      + '<span class="report-badge">' + getCategoryLabel(r.category) + '</span>'
      + '<span class="report-title">' + escapeHtml(r.title) + '</span>'
      + '<span class="report-date">' + r.date + '</span>'
      + '<span class="report-path">' + escapeHtml(r.path) + '</span>'
      + '</div>'
      + '<div class="report-content"><div class="md">' + renderedContent + '</div></div>'
      + '</div>';
  }

  if (visibleCount === 0) {
    html = '<div class="no-results">No reports match your search.</div>';
  }

  container.innerHTML = html;
  statsEl.textContent = visibleCount + ' of ' + reports.length + ' reports';
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toggleReport(el) {
  el.classList.toggle('expanded');
}

function toggleFilter(btn) {
  const cat = btn.dataset.cat;
  btn.classList.toggle('active');
  if (activeFilters.has(cat)) {
    activeFilters.delete(cat);
  } else {
    activeFilters.add(cat);
  }
  renderReports();
}

searchBox.addEventListener('input', function() {
  renderReports();
});

// Initial render
renderReports();
</script>
