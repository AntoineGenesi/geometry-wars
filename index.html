<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Geometry Wars 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      letter-spacing: 4px;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), letter-spacing 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #multiplier-display {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #0f0;
      text-shadow: 0 0 8px #0f0;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #lives-display {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 20px;
      text-shadow: 0 0 8px #f0f;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #bombs-display {
      position: absolute;
      top: 50px;
      right: 30px;
      font-size: 20px;
      text-shadow: 0 0 8px #ff0;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #weapon-display {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      text-shadow: 0 0 8px #ff0;
      transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), color 0.3s, text-shadow 0.3s;
    }
    #combo-display {
      position: absolute;
      top: 60px;
      right: 30px;
      font-size: 18px;
      font-weight: bold;
      color: #ff8800;
      text-shadow: 0 0 10px #ff8800;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.1s, color 0.2s;
    }
    #timer-display {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 8px #ff8800;
      color: #ff8800;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), left 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #timer-display.urgent {
      color: #ff2200;
      text-shadow: 0 0 12px #ff2200;
      animation: timer-pulse 0.5s ease-in-out infinite alternate;
    }
    @keyframes timer-pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }
    #level-name-display {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #668888;
      letter-spacing: 3px;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), letter-spacing 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #player-level-display {
      position: absolute;
      top: 80px;
      right: 30px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #6688aa;
      text-shadow: 0 0 6px #4466aa;
      transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), color 0.3s, text-shadow 0.3s;
    }
    #boost-display {
      position: absolute;
      bottom: 30px;
      left: 30px;
      font-size: 13px;
      letter-spacing: 2px;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff;
      transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), left 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), letter-spacing 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), color 0.2s, text-shadow 0.2s;
    }
    #boost-display.cooldown {
      color: #336655;
      text-shadow: none;
    }
    #boost-display.active {
      color: #ffffff;
      text-shadow: 0 0 16px #00ffff, 0 0 30px #0088ff;
      animation: boost-pulse 0.1s ease-in-out infinite alternate;
    }
    @keyframes boost-pulse {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }
    #countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 30px #00ffff, 0 0 60px #0088ff;
      letter-spacing: 8px;
      opacity: 0;
      transition: opacity 0.2s, font-size 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), letter-spacing 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #countdown-overlay.visible {
      opacity: 1;
    }
    #boss-health-bar {
      display: none;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 10;
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #boss-health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff2244, #ff4466);
      transition: width 0.15s;
    }
    #boss-phase-text {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #ff8888;
      letter-spacing: 2px;
      line-height: 8px;
    }
    #screen-flash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.05s;
    }
    #screen-flash.active {
      opacity: 1;
      transition: none;
    }

    /* ------------------------------------------------------------------- */
    /* Mobile-optimized HUD (larger text, repositioned for touch)           */
    /* Activates on small screens with touch (coarse pointer)               */
    /* ------------------------------------------------------------------- */
    @media (max-width: 900px) and (pointer: coarse) {
      #score-display {
        font-size: 20px;
        top: 8px;
        letter-spacing: 1px;
      }
      #multiplier-display {
        font-size: 12px;
        top: 30px;
      }
      #lives-display {
        font-size: 16px;
        top: 8px;
        right: 12px;
      }
      #bombs-display {
        font-size: 16px;
        top: 28px;
        right: 12px;
      }
      #timer-display {
        font-size: 16px;
        top: 8px;
        left: 12px;
      }
      #weapon-display {
        bottom: 60px; /* higher, above joystick zone */
        font-size: 12px;
      }
      #combo-display {
        font-size: 13px;
        top: 32px;
        right: 12px;
      }
      #level-name-display {
        top: 48px;
        font-size: 10px;
      }
      #player-level-display {
        top: 50px;
        right: 12px;
        font-size: 9px;
      }
      #boost-display {
        bottom: 60px;
        font-size: 11px;
        left: 12px;
      }
      #countdown-overlay {
        font-size: 60px;
      }
      #boss-health-bar {
        width: 150px;
      }
    }
    /* ------------------------------------------------------------------- */
    /* Rotate-device overlay — shown when mobile is held in portrait       */
    /* ------------------------------------------------------------------- */
    #rotate-overlay {
      display: flex;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: #050510;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    /* Show when touch device is in portrait orientation */
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-overlay {
        opacity: 1;
        pointer-events: auto;
      }
    }
    /* Suppress rotate overlay while menu is open */
    body.menu-open #rotate-overlay {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .rotate-icon {
      font-size: 64px;
      animation: rotate-phone 2s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes rotate-phone {
      0%   { transform: rotate(0deg); }
      40%  { transform: rotate(0deg); }
      60%  { transform: rotate(90deg); }
      100% { transform: rotate(90deg); }
    }
    .rotate-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 20px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      letter-spacing: 3px;
      text-align: center;
    }
    .rotate-sub {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      color: #446688;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Loading screen — covers everything until StartMenu is ready */
    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2000;
      background: #050510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .loading-title {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 42px;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #08f;
      letter-spacing: 6px;
      animation: loading-pulse 2s ease-in-out infinite;
    }
    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }
    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0ff;
      animation: loading-dot-pulse 1.4s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loading-pulse {
      0%, 100% { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #08f; }
      50% { text-shadow: 0 0 30px #0ff, 0 0 60px #0ff, 0 0 100px #08f; }
    }
    @keyframes loading-dot-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body class="menu-open">
  <!-- Rotate device prompt (shown via CSS when portrait on touch device; hidden while menu-open) -->
  <div id="rotate-overlay">
    <div class="rotate-icon">📱</div>
    <div class="rotate-text">ROTATE TO PLAY</div>
    <div class="rotate-sub">Hold your phone in landscape mode</div>
  </div>

  <div id="loading-screen">
    <div class="loading-title">GEOMETRY WARS 3D</div>
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>
  <div id="screen-flash"></div>
  <div id="ui-overlay">
    <div id="score-display">0</div>
    <div id="multiplier-display">x1</div>
    <div id="timer-display"></div>
    <div id="lives-display"></div>
    <div id="bombs-display"></div>
    <div id="weapon-display"></div>
    <div id="combo-display"></div>
    <div id="player-level-display"></div>
    <div id="level-name-display"></div>
    <div id="countdown-overlay"></div>
    <div id="boost-display">⚡ BOOST</div>
    <div id="boss-health-bar">
      <div id="boss-health-fill"></div>
      <div id="boss-phase-text"></div>
    </div>
  </div>
  <div id="bottom-hints" style="position:fixed;bottom:6px;right:10px;z-index:800;pointer-events:none;font:10px monospace;color:#446;opacity:0.6;text-align:right;">
    <span id="hint-f3">F3: Debug</span>
    <span id="hint-platform" style="margin-left:8px;display:none;"></span>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Detect platform and show hint
    (function() {
      var p = document.getElementById('hint-platform');
      if (p && navigator.userAgent.indexOf('Windows') !== -1) {
        var isElectron = navigator.userAgent.indexOf('Electron') !== -1;
        p.textContent = isElectron ? 'Windows App' : 'Windows';
        p.style.display = 'inline';
      }
    })();
  </script>
</body>
</html>
