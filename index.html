<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Wars 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      letter-spacing: 4px;
    }
    #multiplier-display {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #0f0;
      text-shadow: 0 0 8px #0f0;
    }
    #lives-display {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 20px;
      text-shadow: 0 0 8px #f0f;
    }
    #bombs-display {
      position: absolute;
      top: 50px;
      right: 30px;
      font-size: 20px;
      text-shadow: 0 0 8px #ff0;
    }
    #weapon-display {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      text-shadow: 0 0 8px #ff0;
      transition: color 0.3s, text-shadow 0.3s;
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div id="score-display">0</div>
    <div id="multiplier-display">x1</div>
    <div id="lives-display"></div>
    <div id="bombs-display"></div>
    <div id="weapon-display"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
