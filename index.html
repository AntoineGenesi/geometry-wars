<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Wars 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      letter-spacing: 4px;
    }
    #multiplier-display {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #0f0;
      text-shadow: 0 0 8px #0f0;
    }
    #lives-display {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 20px;
      text-shadow: 0 0 8px #f0f;
    }
    #bombs-display {
      position: absolute;
      top: 50px;
      right: 30px;
      font-size: 20px;
      text-shadow: 0 0 8px #ff0;
    }
    #weapon-display {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      text-shadow: 0 0 8px #ff0;
      transition: color 0.3s, text-shadow 0.3s;
    }
    #combo-display {
      position: absolute;
      top: 60px;
      right: 30px;
      font-size: 18px;
      font-weight: bold;
      color: #ff8800;
      text-shadow: 0 0 10px #ff8800;
      transition: transform 0.1s, color 0.2s;
    }
    #timer-display {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 8px #ff8800;
      color: #ff8800;
    }
    #timer-display.urgent {
      color: #ff2200;
      text-shadow: 0 0 12px #ff2200;
      animation: timer-pulse 0.5s ease-in-out infinite alternate;
    }
    @keyframes timer-pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }
    #level-name-display {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #668888;
      letter-spacing: 3px;
    }
    #countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 30px #00ffff, 0 0 60px #0088ff;
      letter-spacing: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #countdown-overlay.visible {
      opacity: 1;
    }
    #boss-health-bar {
      display: none;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 10;
    }
    #boss-health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff2244, #ff4466);
      transition: width 0.15s;
    }
    #boss-phase-text {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #ff8888;
      letter-spacing: 2px;
      line-height: 8px;
    }
    #screen-flash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.05s;
    }
    #screen-flash.active {
      opacity: 1;
      transition: none;
    }
  </style>
</head>
<body>
  <div id="screen-flash"></div>
  <div id="ui-overlay">
    <div id="score-display">0</div>
    <div id="multiplier-display">x1</div>
    <div id="timer-display"></div>
    <div id="lives-display"></div>
    <div id="bombs-display"></div>
    <div id="weapon-display"></div>
    <div id="combo-display"></div>
    <div id="level-name-display"></div>
    <div id="countdown-overlay"></div>
    <div id="boss-health-bar">
      <div id="boss-health-fill"></div>
      <div id="boss-phase-text"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
